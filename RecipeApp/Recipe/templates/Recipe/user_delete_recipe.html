{% extends "Recipe/base.html" %}

{% block content %}
<div class="form-container">
    <h2>Delete Recipe</h2>

    <p>Are you sure you want to delete <strong>{{ recipe.name }}</strong>?</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn" style="background:#d9534f;">Delete</button>
        <a href="{% url 'edit_account' %}" class="btn" style="background:#4a90e2;">Cancel</a>
    </form>
</div>
{% endblock %}
