{% extends "Recipe/base.html" %}

{% block content %}
<div class="form-container">
    <h2>Edit Your Recipe</h2>

    <form method="POST" enctype="multipart/form-data" class="recipe-form">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn">Save Changes</button>
    </form>
</div>
{% endblock %}
